<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediLink - Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <h1><i class="fas fa-heartbeat"></i> MediLink</h1>
    <p class="subtitle">Healthcare management system</p>

    <!-- Step 1: choose a role -->
    <div id="step-role">
      <div class="roles" id="roles"></div>
    </div>

    <!-- Step 2: sign in -->
    <form id="step-login" class="hidden">
      <h3 id="login-title" style="margin-bottom:1rem"></h3>
      <div class="fields">
        <div><label>Email</label><input type="email" name="email" required></div>
        <div><label>Password</label><input type="password" name="password" required></div>
      </div>
      <button class="btn primary">Sign in</button>
      <button type="button" class="link" id="to-register">New patient? Create an account</button>
      <button type="button" class="link back">&larr; Choose another role</button>
      <p class="hint">Demo: admin@medilink.com / password123 (same password for every demo role)</p>
    </form>

    <!-- Step 3: patient registration -->
    <form id="step-register" class="hidden">
      <h3 style="margin-bottom:1rem">Create patient account</h3>
      <div class="fields">
        <div><label>Full name</label><input name="full_name" required></div>
        <div><label>Email</label><input type="email" name="email" required></div>
        <div><label>Password (min 6 characters)</label><input type="password" name="password" minlength="6" required></div>
        <div><label>Date of birth</label><input type="date" name="date_of_birth" required></div>
        <div><label>Gender</label><select name="gender" required><option>Male</option><option>Female</option><option>Other</option></select></div>
      </div>
      <button class="btn primary">Register</button>
      <button type="button" class="link back">&larr; Back to sign in</button>
    </form>
    <p id="msg" class="hint" style="color:var(--red)"></p>
  </div>

<script>
const ROLES = {
  patient: ['Patient', 'fa-user'], doctor: ['Doctor', 'fa-user-md'], admin: ['Administrator', 'fa-user-shield'],
  staff: ['Front Desk Staff', 'fa-headset'], financial: ['Financial Team', 'fa-coins'],
  datascientist: ['Data Scientist', 'fa-chart-line'], insurance: ['Insurance Provider', 'fa-file-shield'],
};
let role = '';
const $ = id => document.getElementById(id);
const show = id => ['step-role', 'step-login', 'step-register'].forEach(s => $(s).classList.toggle('hidden', s !== id));
const say = (text, ok) => { $('msg').textContent = text; $('msg').style.color = ok ? 'var(--green)' : 'var(--red)'; };

$('roles').innerHTML = Object.entries(ROLES).map(([key, [name, icon]]) =>
  `<div class="role-card" data-role="${key}"><i class="fas ${icon}"></i>${name}</div>`).join('');

$('roles').onclick = e => {
  const card = e.target.closest('.role-card');
  if (!card) return;
  role = card.dataset.role;
  $('login-title').textContent = 'Sign in as ' + ROLES[role][0];
  $('to-register').classList.toggle('hidden', role !== 'patient');   // only patients can self-register
  say(''); show('step-login');
};
document.querySelectorAll('.back').forEach(b => (b.onclick = () => { say(''); show(b.closest('form').id === 'step-register' ? 'step-login' : 'step-role'); }));
$('to-register').onclick = () => { say(''); show('step-register'); };

async function post(url, data) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  return { ok: res.ok, ...(await res.json()) };
}

$('step-login').onsubmit = async e => {
  e.preventDefault();
  const r = await post('api/auth/login.php', { ...Object.fromEntries(new FormData(e.target)), role });
  r.ok ? (location.href = r.redirect) : say(r.message);
};
$('step-register').onsubmit = async e => {
  e.preventDefault();
  const r = await post('api/auth/register.php', Object.fromEntries(new FormData(e.target)));
  say(r.message, r.ok);
  if (r.ok) show('step-login');
};
</script>
</body>
</html>
